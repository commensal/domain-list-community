name: Test PR
on:
  pull_request:
    branches:
      - master
jobs:
  test:
    name: Test compiler
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run compiler tests
        run: go test ./...

      - name: Build a sample dat and check category case
        run: |
          mkdir -p data
          printf 'example.com\n' > data/custom
          printf 'include:custom\n' > data/sample
          go run . --datapath=./data --outputdir=./ --outputname=sample.dat
          python3 - << 'PY'
          from pathlib import Path
          blob = Path("sample.dat").read_bytes()
          codes = []
          start = 0
          mark = b"\n\x12"
          while True:
              i = blob.find(mark, start)
              if i < 0:
                  break
              i += 1
              length = blob[i + 1]
              codes.append(blob[i + 2:i + 2 + length].decode())
              start = i + 2 + length
          if codes != ["custom", "sample"]:
              raise SystemExit(f"expected lowercase category codes, got {codes}")
          print("category codes:", ", ".join(codes))
          PY
