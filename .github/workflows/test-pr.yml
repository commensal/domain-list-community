name: Test PR
on:
  pull_request:
    branches:
      - master
jobs:
  test:
    name: Test compiler
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run compiler tests
        run: go test ./...

      - name: Build a sample dat and check category case
        run: |
          mkdir -p data
          printf 'example.com\n' > data/custom
          printf 'include:custom\n' > data/sample
          go run . --datapath=./data --outputdir=./ --outputname=sample.dat
          python3 - << 'PY'
          from pathlib import Path

          def varint(data, index):
              value = shift = 0
              while True:
                  byte = data[index]
                  index += 1
                  value |= (byte & 0x7F) << shift
                  if byte < 128:
                      return value, index
                  shift += 7

          def messages(data, field_number):
              index = 0
              found = []
              while index < len(data):
                  key, index = varint(data, index)
                  field, wire = key >> 3, key & 7
                  if wire == 0:
                      _, index = varint(data, index)
                  elif wire == 1:
                      index += 8
                  elif wire == 2:
                      length, index = varint(data, index)
                      if field == field_number:
                          found.append(data[index:index + length])
                      index += length
                  elif wire == 5:
                      index += 4
                  else:
                      raise ValueError(f"unsupported wire type {wire}")
              return found

          def country_codes(blob):
              return sorted(messages(entry, 1)[0].decode("utf-8") for entry in messages(blob, 1))

          codes = country_codes(Path("sample.dat").read_bytes())
          if codes != ["CUSTOM", "SAMPLE"]:
              raise SystemExit(f"expected uppercase category codes ['CUSTOM', 'SAMPLE'], got {codes}")
          print("category codes:", ", ".join(codes))
          PY
