name: Build geosite and geoip

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "**/README.md"
      - "HAPP/**"
      - "INCY/**"
      - "index.html"
  schedule:
    - cron: "0 2 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: code
          fetch-depth: 1
          token: ${{ github.token }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: code/go.mod
          cache-dependency-path: code/go.sum

      - name: Run unit tests
        working-directory: code
        run: go test -v ./...

      - name: Clone itdoginfo/allow-domains
        run: git clone --depth 1 https://github.com/itdoginfo/allow-domains.git itdog-domains

      - name: Fetch previous geo files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Download previously published dat files directly from release branch.
          # Cloning avoids the GitHub Contents API 1MB limit and ignores missing branch gracefully.
          rm -f previous-geosite.dat previous-geoip.dat
          git clone --depth 1 --branch release "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" prev-release 2>/dev/null || true
          if [ -d prev-release ]; then
            [ -f prev-release/geosite.dat ] && cp prev-release/geosite.dat previous-geosite.dat || true
            [ -f prev-release/geoip.dat ] && cp prev-release/geoip.dat previous-geoip.dat || true
            rm -rf prev-release
          fi
          for f in previous-geosite.dat previous-geoip.dat; do
            if [ -f "$f" ]; then
              wc -c "$f"
              sha256sum "$f"
            fi
          done

      - name: Prepare category lists
        run: bash code/.github/scripts/prepare-lists.sh code itdog-domains

      - name: Build geosite.dat
        working-directory: code
        run: |
          go run ./ --outputdir=../ --outputname=geosite.dat
          test -s ../geosite.dat

      - name: Build geoip.dat
        run: |
          # Xray uppercases the rule code and compares those bytes exactly.
          python3 code/.github/scripts/pack-geoip.py code/geoip-source geoip.dat
          test -s geoip.dat

      - name: Verify profile categories exist
        run: python3 code/.github/scripts/verify-dat.py geosite.dat geoip.dat code

      - name: Update routing profiles
        run: |
          bash code/.github/scripts/update-routing.sh code previous-geosite.dat previous-geoip.dat \
            "$PWD/geosite.dat" "$PWD/geoip.dat" \
            | tee routing.env
          grep -E '^(geo_changed|profile_changed|last_updated)=' routing.env | tee -a "$GITHUB_STEP_SUMMARY" >> "$GITHUB_ENV"

      - name: Generate hashes and archives
        run: |
          sha256sum geosite.dat > geosite.dat.sha256sum
          zip -9 geosite.dat.zip geosite.dat
          sha256sum geosite.dat.zip > geosite.dat.zip.sha256sum
          sha256sum geoip.dat > geoip.dat.sha256sum
          zip -9 geoip.dat.zip geoip.dat
          sha256sum geoip.dat.zip > geoip.dat.zip.sha256sum

      - name: Publish geo files to the release branch
        if: env.geo_changed == 'true'
        run: |
          mkdir -p release-publish
          cd release-publish
          cp ../geosite.dat ../geoip.dat ../geosite.dat.zip ../geoip.dat.zip ../*.sha256sum .
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add geosite.dat geoip.dat *.zip *.sha256sum
          git commit -m "Update geo files ${{ env.last_updated }}"
          # The release branch holds only generated files, so replacing it is intended.
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:release

      - name: Publish the release
        if: env.geo_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # The checkout lives in code/. gh otherwise looks for .git here and fails.
          GH_REPO: ${{ github.repository }}
        run: |
          tag="geo-${{ env.last_updated }}"
          gh release delete "$tag" --cleanup-tag --yes || true
          gh release create "$tag" \
            --target "${{ github.sha }}" \
            --latest \
            --title "$tag" \
            --notes "Geo files changed. Routing LastUpdated is ${{ env.last_updated }}." \
            ./geosite.dat ./geosite.dat.zip ./geoip.dat ./geoip.dat.zip ./*.sha256sum
          # Keep the new release and one previous release. Clients only need the
          # latest files, and the previous tag is the rollback point.
          gh release list --limit 1000 --json tagName,publishedAt --jq '.[].tagName' \
            | awk 'NR > 2 { print }' \
            | while read -r old; do
                [ -n "$old" ] && gh release delete "$old" --cleanup-tag --yes || true
              done

      - name: Commit refreshed deeplinks
        if: env.geo_changed == 'true' || env.profile_changed == 'true'
        working-directory: code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HAPP INCY index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refresh routing LastUpdated ${{ env.last_updated }}"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:master

      - name: Skip release
        if: env.geo_changed != 'true'
        run: echo "Geo files are unchanged. The release branch and tags were left as they are."
