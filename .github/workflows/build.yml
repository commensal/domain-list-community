name: Build geosite and geoip

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "**/README.md"
  schedule:
    - cron: "0 2 * * *" # Автоматическое обновление каждый день в 02:00

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: code

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '>=1.26.0'

      - name: Set variables
        run: |
          echo "RELEASE_NAME=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV
          echo "TAG_NAME=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV
        shell: bash

      - name: Download custom lists (geosite)
        run: |
          mkdir -p code/data
          cd code/data
          rm -rf *
          curl -sL "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Categories/block.lst" | sed 's/^domain://g' | grep -v "^#" | grep -v "^\." > ru-block
          curl -sL "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Categories/porn.lst" | sed 's/^domain://g' | grep -v "^#" | grep -v "^\." > porn
          curl -sL "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Categories/geoblock.lst" | sed 's/^domain://g' | grep -v "^#" | grep -v "^\." > geoblock
          
          echo -e "facebook.com\ninstagram.com\nfbcdn.net\nmeta.com\nthreads.net" > meta
          echo -e "telegram.org\ntelegram.me\nt.me\ntdesktop.org" > telegram
          echo -e "youtube.com\nyoutu.be\ngooglevideo.com\nytimg.com\nggpht.com" > youtube

      - name: Build geosite.dat
        run: |
          cd code || exit 1
          go run ./ --outputdir=../
          cd ../
          mv dlc.dat geosite.dat
          rm -rf code

      - name: Build geoip.dat
        run: |
          mkdir -p geoip-build
          cd geoip-build
          
          # Скачиваем подсети (Subnets) от itdog
          curl -sL "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Subnets/telegram.lst" | grep -v "^#" > telegram.txt
          curl -sL "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Subnets/meta.lst" | grep -v "^#" > meta.txt
          curl -sL "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Subnets/twitter.lst" | grep -v "^#" > twitter.txt
          curl -sL "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Subnets/discord.lst" | grep -v "^#" > discord.txt
          
          # Создаем собственный Go-скрипт для прямой компиляции geoip.dat
          cat > pack.go << 'EOF'
          package main

          import (
          	"bufio"
          	"log"
          	"net"
          	"os"
          	"strings"

          	"google.golang.org/protobuf/proto"
          	"github.com/v2fly/v2ray-core/v5/app/router/routercommon"
          )

          func main() {
          	var geoipList routercommon.GeoIPList
          	files := []string{"telegram", "meta", "twitter", "discord"}
          	
          	for _, name := range files {
          		file, err := os.Open(name + ".txt")
          		if err != nil { log.Fatal(err) }
          		
          		geoip := &routercommon.GeoIP{ CountryCode: strings.ToUpper(name) }
          		scanner := bufio.NewScanner(file)
          		
          		for scanner.Scan() {
          			line := strings.TrimSpace(scanner.Text())
          			if line == "" || strings.HasPrefix(line, "#") { continue }
          			
          			ip, ipNet, err := net.ParseCIDR(line)
          			if err != nil {
          				ip = net.ParseIP(line)
          				if ip == nil { continue }
          				if ip.To4() != nil {
          					ipNet = &net.IPNet{IP: ip, Mask: net.CIDRMask(32, 32)}
          				} else {
          					ipNet = &net.IPNet{IP: ip, Mask: net.CIDRMask(128, 128)}
          				}
          			}

          			ipBytes := ipNet.IP
          			if ipNet.IP.To4() != nil { ipBytes = ipNet.IP.To4() }
          			ones, _ := ipNet.Mask.Size()
          			
          			geoip.Cidr = append(geoip.Cidr, &routercommon.CIDR{
          				Ip:     ipBytes,
          				Prefix: uint32(ones),
          			})
          		}
          		file.Close()
          		geoipList.Entry = append(geoipList.Entry, geoip)
          	}

          	out, err := proto.Marshal(&geoipList)
          	if err != nil { log.Fatal(err) }
          	os.WriteFile("geoip.dat", out, 0644)
          }
          EOF
          
          # Инициализируем модуль, подтягиваем зависимости ядра V2Ray и собираем файл
          go mod init geoip
          go mod tidy
          go run pack.go
          
          mv geoip.dat ../
          cd ../
          rm -rf geoip-build

      - name: Generate hashes and archives
        run: |
          sha256sum geosite.dat > geosite.dat.sha256sum
          zip -9 geosite.dat.zip geosite.dat
          sha256sum geosite.dat.zip > geosite.dat.zip.sha256sum
          
          sha256sum geoip.dat > geoip.dat.sha256sum
          zip -9 geoip.dat.zip geoip.dat
          sha256sum geoip.dat.zip > geoip.dat.zip.sha256sum

      - name: Git push assets to "release" branch
        run: |
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add geosite.dat geoip.dat *.zip *.sha256sum
          git commit -m "${{ env.RELEASE_NAME }}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u origin release

      - name: Release and upload assets
        run: |
          gh release create ${{ env.TAG_NAME }} --target ${{ github.sha }} --generate-notes --latest --title ${{ env.RELEASE_NAME }} ./geosite.dat ./geosite.dat.zip ./geoip.dat ./geoip.dat.zip ./*.sha256sum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}