name: Build geosite and geoip

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "**/README.md"
  schedule:
    - cron: "0 2 * * *" 

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: code

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Set variables
        run: |
          echo "RELEASE_NAME=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV
          echo "TAG_NAME=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV
        shell: bash

      - name: Download custom lists (geosite)
        run: |
          mkdir -p code/data
          cd code/data
          rm -rf *
          curl -sL "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Categories/block.lst" | sed 's/^domain://g' | grep -v "^#" | grep -v "^\." > ru-block || true
          curl -sL "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Categories/porn.lst" | sed 's/^domain://g' | grep -v "^#" | grep -v "^\." > porn || true
          curl -sL "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Categories/geoblock.lst" | sed 's/^domain://g' | grep -v "^#" | grep -v "^\." > geoblock || true
          
          # Читаем твой личный список доменов из корня репозитория (если он существует)
          if [ -f "../../code/my-domains.txt" ]; then
            cat ../../code/my-domains.txt | grep -v "^#" | grep -v "^package:" | sed 's/^domain://g' > custom || true
          elif [ -f "../../my-domains.txt" ]; then
            cat ../../my-domains.txt | grep -v "^#" | grep -v "^package:" | sed 's/^domain://g' > custom || true
          else
            echo "example.com" > custom
          fi
          
          if [ ! -s custom ]; then
            echo "example.com" > custom
          fi
          
          echo -e "facebook.com\ninstagram.com\nfbcdn.net\nmeta.com\nthreads.net" > meta
          echo -e "telegram.org\ntelegram.me\nt.me\ntdesktop.org" > telegram
          echo -e "youtube.com\nyoutu.be\ngooglevideo.com\nytimg.com\nggpht.com" > youtube

      - name: Build geosite.dat
        run: |
          cd code || exit 1
          go run ./ --outputdir=../
          cd ../
          mv dlc.dat geosite.dat
          # Оставляем папку code, она нам больше не помешает

      - name: Build geoip.dat
        run: |
          mkdir -p geoip-build
          cd geoip-build
          
          # Скачиваем подсети от itdog (объединяем IPv4 и IPv6)
          curl -sL "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Subnets/IPv4/telegram.lst" | grep -v "^#" > telegram.txt || true
          curl -sL "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Subnets/IPv6/telegram.lst" | grep -v "^#" >> telegram.txt || true
          
          curl -sL "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Subnets/IPv4/meta.lst" | grep -v "^#" > meta.txt || true
          curl -sL "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Subnets/IPv6/meta.lst" | grep -v "^#" >> meta.txt || true
          
          curl -sL "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Subnets/IPv4/twitter.lst" | grep -v "^#" > twitter.txt || true
          curl -sL "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Subnets/IPv6/twitter.lst" | grep -v "^#" >> twitter.txt || true
          
          # Удаляем возможные сообщения 404, если curl скачал страницу с ошибкой
          sed -i '/404/d' telegram.txt meta.txt twitter.txt || true
          
          # Читаем твой личный список IP (если он есть)
          if [ -f "../code/my-ips.txt" ]; then
            cat ../code/my-ips.txt | grep -v "^#" > custom.txt || true
          elif [ -f "../my-ips.txt" ]; then
            cat ../my-ips.txt | grep -v "^#" > custom.txt || true
          else
            echo "127.0.0.1/32" > custom.txt
          fi
          
          if [ ! -s custom.txt ]; then
            echo "127.0.0.1/32" > custom.txt
          fi
          
          # У v2fly/geoip логика сборки ожидает текстовые файлы в директории
          mkdir -p geoip-source
          mv telegram.txt geoip-source/telegram.txt
          mv meta.txt geoip-source/meta.txt
          mv twitter.txt geoip-source/twitter.txt
          mv custom.txt geoip-source/custom.txt
          
          # Конфиг для генерации
          cat << 'EOF' > config.json
          {
            "input": [
              {
                "type": "text",
                "action": "add",
                "args": {
                  "inputDir": "./geoip-source"
                }
              }
            ],
            "output": [
              {
                "type": "v2rayGeoIPDat",
                "action": "output",
                "args": {
                  "outputDir": "../",
                  "outputName": "geoip.dat"
                }
              }
            ]
          }
          EOF
          
          # Запускаем компиляцию через v2fly/geoip
          go run github.com/v2fly/geoip@latest -c config.json
          
          cd ../
          rm -rf geoip-build

      - name: Generate hashes and archives
        run: |
          sha256sum geosite.dat > geosite.dat.sha256sum
          zip -9 geosite.dat.zip geosite.dat
          sha256sum geosite.dat.zip > geosite.dat.zip.sha256sum
          
          sha256sum geoip.dat > geoip.dat.sha256sum
          zip -9 geoip.dat.zip geoip.dat
          sha256sum geoip.dat.zip > geoip.dat.zip.sha256sum

      - name: Git push assets to "release" branch
        run: |
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add geosite.dat geoip.dat *.zip *.sha256sum
          git commit -m "${{ env.RELEASE_NAME }}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u origin release

      - name: Release and upload assets
        run: |
          gh release create ${{ env.TAG_NAME }} --target ${{ github.sha }} --generate-notes --latest --title ${{ env.RELEASE_NAME }} ./geosite.dat ./geosite.dat.zip ./geoip.dat ./geoip.dat.zip ./*.sha256sum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}