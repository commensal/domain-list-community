name: Build geosite.dat

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "**/README.md"
  schedule:
    - cron: "0 2 * * *" # Автоматическое обновление каждый день в 02:00
    
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: code

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: code/go.mod
          cache-dependency-path: code/go.sum

      - name: Set variables
        run: |
          echo "RELEASE_NAME=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV
          echo "TAG_NAME=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV
        shell: bash

      - name: Download custom lists
        run: |
          cd code/data
          # 1. Полностью удаляем стандартную китайскую базу v2fly (чтобы файл весил минимум)
          rm -rf *
          
          # 2. Скачиваем свежие списки itdog и сохраняем их как нужные нам категории
          # Команда sed убирает лишние символы и префиксы, оставляя только чистые домены
          curl -sL "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Categories/block.lst" | sed 's/^domain://g' | grep -v "^#" > ru-block
          curl -sL "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Categories/porn.lst" | sed 's/^domain://g' | grep -v "^#" > porn
          curl -sL "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Categories/geoblock.lst" | sed 's/^domain://g' | grep -v "^#" > geoblock
          
          # 3. Вписываем нужные соцсети вручную (чтобы не тянуть лишнее)
          echo -e "facebook.com\ninstagram.com\nfbcdn.net\nmeta.com\nthreads.net" > meta
          echo -e "telegram.org\ntelegram.me\nt.me\ntdesktop.org" > telegram
          echo -e "youtube.com\nyoutu.be\ngooglevideo.com\nytimg.com\nggpht.com" > youtube

      - name: Build geosite.dat
        run: |
          cd code || exit 1
          # Генерируем базу без указания старых категорий
          go run ./ --outputdir=../
          cd ../
          # Переименовываем стандартный dlc.dat в geosite.dat для удобства
          mv dlc.dat geosite.dat
          rm -rf code

      - name: Generate hashes and archives
        run: |
          sha256sum geosite.dat > geosite.dat.sha256sum
          zip -9 geosite.dat.zip geosite.dat
          sha256sum geosite.dat.zip > geosite.dat.zip.sha256sum

      - name: Git push assets to "release" branch
        run: |
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add geosite.dat geosite.dat.zip *.sha256sum
          git commit -m "${{ env.RELEASE_NAME }}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u origin release

      - name: Release and upload assets
        run: |
          gh release create ${{ env.TAG_NAME }} --target ${{ github.sha }} --generate-notes --latest --title ${{ env.RELEASE_NAME }} ./geosite.dat ./geosite.dat.zip ./*.sha256sum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}