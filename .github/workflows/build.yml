- name: Build geoip.dat
        run: |
          mkdir -p geoip-build
          cd geoip-build
          
          # Скачиваем подсети от itdog
          curl -sL "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Subnets/telegram.lst" | grep -v "^#" > telegram.txt
          curl -sL "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Subnets/meta.lst" | grep -v "^#" > meta.txt
          curl -sL "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Subnets/twitter.lst" | grep -v "^#" > twitter.txt
          
          # Читаем твой личный список IP (если он есть)
          if [ -f "../my-ips.txt" ]; then
            cat ../my-ips.txt | grep -v "^#" > custom.txt
          else
            echo "127.0.0.1/32" > custom.txt
          fi
          
          # Скачиваем официальную утилиту Xray-core
          wget https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip Xray-linux-64.zip xray
          chmod +x xray
          
          # У Xray другая логика сборки: он ожидает папку, где каждый текстовый файл = категория
          mkdir -p geoip-source
          mv telegram.txt geoip-source/telegram
          mv meta.txt geoip-source/meta
          mv twitter.txt geoip-source/twitter
          mv custom.txt geoip-source/custom
          
          # Запускаем компиляцию через Xray
          ./xray pack geoip -d geoip-source -o geoip.dat
          
          mv geoip.dat ../
          cd ../
          rm -rf geoip-build