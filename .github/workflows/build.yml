name: Build geosite and geoip

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "**/README.md"
  schedule:
    - cron: "0 2 * * *" 

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: code

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Set variables
        run: |
          echo "RELEASE_NAME=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV
          echo "TAG_NAME=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV
        shell: bash

      - name: Clone itdoginfo/allow-domains
        run: |
          git clone https://github.com/itdoginfo/allow-domains.git itdog-domains

      - name: Download custom lists (geosite)
        run: |
          mkdir -p code/data
          cd code/data
          rm -rf *
          
          # Обрабатываем Categories
          for f in ../../itdog-domains/Categories/*.lst; do
              [ -e "$f" ] || continue
              name=$(basename "$f" .lst | tr '[:upper:]' '[:lower:]')
              if [ "$name" == "block" ]; then name="ru-block"; fi
              cat "$f" | sed 's/^domain://g' | grep -v "^#" | grep -v "^\." >> "$name" || true
          done
          
          # Обрабатываем Services
          for f in ../../itdog-domains/Services/*.lst; do
              [ -e "$f" ] || continue
              name=$(basename "$f" .lst | tr '[:upper:]' '[:lower:]')
              cat "$f" | sed 's/^domain://g' | grep -v "^#" | grep -v "^\." >> "$name" || true
          done
          
          # Добавляем хардкод (на всякий случай, чтобы не потерять то, что было)
          echo "" >> meta
          echo -e "facebook.com\ninstagram.com\nfbcdn.net\nmeta.com\nthreads.net" >> meta
          echo "" >> telegram
          echo -e "telegram.org\ntelegram.me\nt.me\ntdesktop.org" >> telegram
          echo "" >> youtube
          echo -e "youtube.com\nyoutu.be\ngooglevideo.com\nytimg.com\nggpht.com" >> youtube
          
          # Читаем твой личный список доменов из корня репозитория (если он существует)
          if [ -f "../../code/my-domains.txt" ]; then
            cat ../../code/my-domains.txt | grep -v "^#" | grep -v "^package:" | sed 's/^domain://g' >> custom || true
          elif [ -f "../../my-domains.txt" ]; then
            cat ../../my-domains.txt | grep -v "^#" | grep -v "^package:" | sed 's/^domain://g' >> custom || true
          fi
          
          # Убираем дубликаты, пустые строки и Windows переносы (\r) во всех сгенерированных списках
          for f in *; do
              if [ -f "$f" ]; then
                  tr -d '\r' < "$f" | sort -u | sed '/^$/d' > "$f.tmp"
                  mv "$f.tmp" "$f"
              fi
          done
          
          if [ ! -s custom ]; then
            echo "example.com" > custom
          fi

      - name: Build geosite.dat
        run: |
          cd code || exit 1
          go run ./ --outputdir=../
          cd ../
          mv dlc.dat geosite.dat
          # Оставляем папку code, она нам больше не помешает

      - name: Build geoip.dat
        run: |
          mkdir -p geoip-build/geoip-source
          cd geoip-build
          
          # Обрабатываем IPv4 подсети
          for f in ../itdog-domains/Subnets/IPv4/*.lst; do
              [ -e "$f" ] || continue
              name=$(basename "$f" .lst | tr '[:upper:]' '[:lower:]')
              cat "$f" | grep -v "^#" >> geoip-source/${name}.txt || true
          done
          
          # Обрабатываем IPv6 подсети
          for f in ../itdog-domains/Subnets/IPv6/*.lst; do
              [ -e "$f" ] || continue
              name=$(basename "$f" .lst | tr '[:upper:]' '[:lower:]')
              cat "$f" | grep -v "^#" >> geoip-source/${name}.txt || true
          done
          
          # Читаем твой личный список IP (если он есть)
          if [ -f "../code/my-ips.txt" ]; then
            cat ../code/my-ips.txt | grep -v "^#" >> geoip-source/custom.txt || true
          elif [ -f "../my-ips.txt" ]; then
            cat ../my-ips.txt | grep -v "^#" >> geoip-source/custom.txt || true
          fi
          
          # Убираем дубликаты, пустые строки и \r, добавляем фейковый IP для пустых файлов
          for f in geoip-source/*.txt; do
              [ -e "$f" ] || continue
              tr -d '\r' < "$f" | sort -u | sed '/^$/d' > "$f.tmp"
              if [ ! -s "$f.tmp" ]; then
                  echo "127.0.0.1/32" > "$f.tmp"
              fi
              mv "$f.tmp" "$f"
          done
          
          # Конфиг для генерации
          cat << 'EOF' > config.json
          {
            "input": [
              {
                "type": "text",
                "action": "add",
                "args": {
                  "inputDir": "./geoip-source"
                }
              }
            ],
            "output": [
              {
                "type": "v2rayGeoIPDat",
                "action": "output",
                "args": {
                  "outputDir": "../",
                  "outputName": "geoip.dat"
                }
              }
            ]
          }
          EOF
          
          # Запускаем компиляцию через v2fly/geoip
          go run github.com/v2fly/geoip@latest -c config.json
          
          cd ../
          rm -rf geoip-build itdog-domains

      - name: Generate hashes and archives
        run: |
          sha256sum geosite.dat > geosite.dat.sha256sum
          zip -9 geosite.dat.zip geosite.dat
          sha256sum geosite.dat.zip > geosite.dat.zip.sha256sum
          
          sha256sum geoip.dat > geoip.dat.sha256sum
          zip -9 geoip.dat.zip geoip.dat
          sha256sum geoip.dat.zip > geoip.dat.zip.sha256sum

      - name: Git push assets to "release" branch
        run: |
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add geosite.dat geoip.dat *.zip *.sha256sum
          git commit -m "${{ env.RELEASE_NAME }}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u origin release

      - name: Release and upload assets
        run: |
          gh release create ${{ env.TAG_NAME }} --target ${{ github.sha }} --generate-notes --latest --title ${{ env.RELEASE_NAME }} ./geosite.dat ./geosite.dat.zip ./geoip.dat ./geoip.dat.zip ./*.sha256sum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}