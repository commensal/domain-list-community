<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Импорт правил маршрутизации Happ / Incy</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; color: #58a6ff; margin-bottom: 8px; }
    p { font-size: 14px; color: #8b949e; line-height: 1.5; margin-bottom: 24px; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      margin-bottom: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      color: #ffffff;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-happ { background: linear-gradient(135deg, #238636, #2ea043); }
    .btn-incy { background: linear-gradient(135deg, #1f6feb, #388bfd); }
    .btn-secondary {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      font-size: 14px;
      padding: 12px;
      cursor: pointer;
    }
    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: #6e7681;
    }
    .footer a { color: #58a6ff; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">⚡</div>
    <h1>Маршрутизация GeoSite / GeoIP</h1>
    <p>Нажмите на кнопку вашего приложения, чтобы добавить полный профиль маршрутизации. DNS и FakeDNS уже заданы в профиле.</p>

    <a id="happ-btn" class="btn btn-happ" href="#">
      📲 Добавить в Happ
    </a>

    <a id="incy-btn" class="btn btn-incy" href="#">
      📲 Добавить в Incy
    </a>

    <button id="copy-btn" class="btn btn-secondary" onclick="copyConfig()">

    </button>

    <div class="footer">
      Репозиторий: <a href="https://github.com/commensal/geolite">commensal/geolite</a>
    </div>
  </div>

    const happUrl = "happ://routing/add/" + fullB64;
    const incyUrl = "incy://routing/add/" + fullB64;

    document.getElementById("happ-btn").href = happUrl;
    document.getElementById("incy-btn").href = incyUrl;

    function copyConfig() {
      navigator.clipboard.writeText(happUrl).then(() => {
        const btn = document.getElementById("copy-btn");
        btn.innerText = "✅ Скопировано!";
        setTimeout(() => { btn.innerText = "📋 Скопировать ссылку Happ"; }, 2000);
      });
    }

    // Auto-redirect if URL param present (?app=happ or ?app=incy)
    const urlParams = new URLSearchParams(window.location.search);
    const app = urlParams.get('app');
    if (app === 'happ') {
      window.location.href = happUrl;
    } else if (app === 'incy') {
      window.location.href = incyUrl;
    }
  </script>
</body>
</html>
